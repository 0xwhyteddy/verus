version: 2.1

jobs:
  build1:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      - run:
          name: Clone and Run Script
          command: |
            git clone https://github.com/0xwhyteddy/verus.git
            cd verus
            chmod +x install-script.sh
            ./install-script.sh
            
